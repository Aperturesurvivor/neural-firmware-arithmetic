<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Deterministic neurons inside Qwen — Phase 7 architecture and results</title>
  <desc id="description">A frozen zero-parameter addition circuit occupies 28 existing coordinates inside Qwen2.5-0.5B's layer-16 MLP. Sixteen learned interface coordinates feed the circuit and twelve deterministic result coordinates return through Qwen's original downstream layers. Across three seeds the model produced 173 exact answers out of 180, compared with 9 out of 180 after result-channel ablation. The strict protocol passed three of five gates.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1426"/>
      <stop offset="1" stop-color="#11172a"/>
    </linearGradient>
    <linearGradient id="learned" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48d7ff"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="exact" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7bf1a8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000814" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a8b3c7" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#62d9ff"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffbe55"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5ee58d"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .caps { letter-spacing: 2.2px; font-weight: 700; }
      .muted { fill: #98a6bc; }
      .white { fill: #f7fbff; }
      .label { font-size: 18px; font-weight: 700; letter-spacing: 0.6px; }
      .body { font-size: 19px; fill: #c3cfdf; }
      .small { font-size: 16px; fill: #96a5bb; }
      .metric { font-size: 56px; font-weight: 760; fill: #f8fbff; }
      .metric-label { font-size: 18px; fill: #aebbd0; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1340" cy="75" r="260" fill="#2962ff" opacity="0.08"/>
  <circle cx="290" cy="820" r="330" fill="#00c9a7" opacity="0.055"/>

  <g class="sans">
    <text x="92" y="78" class="caps" font-size="18" fill="#64ddff">NEURAL FIRMWARE · PHASE 7</text>
    <text x="92" y="140" class="white" font-size="50" font-weight="760">Deterministic “neurons” inside Qwen</text>
    <text x="92" y="184" class="body" font-size="22">A frozen calculator occupies existing MLP activation coordinates—not an external tool call.</text>

    <g filter="url(#shadow)">
      <rect x="72" y="232" width="1000" height="542" rx="34" fill="#101b2d" stroke="#2b3950" stroke-width="2"/>
      <rect x="1098" y="232" width="430" height="542" rx="34" fill="#101b2d" stroke="#2b3950" stroke-width="2"/>
    </g>

    <text x="116" y="283" class="caps muted" font-size="15">IN-PLACE ARCHITECTURE</text>
    <text x="116" y="319" class="white" font-size="22" font-weight="700">Qwen2.5-0.5B · decoder layer 16 · frozen base model</text>

    <!-- Model residual -->
    <rect x="116" y="374" width="188" height="242" rx="24" fill="#17243a" stroke="#34455f" stroke-width="2"/>
    <text x="210" y="418" text-anchor="middle" class="label white">MODEL STATE</text>
    <text x="210" y="458" text-anchor="middle" class="body">
      <tspan x="210" dy="0">Natural-language</tspan>
      <tspan x="210" dy="27">request + token</tspan>
      <tspan x="210" dy="27">residuals</tspan>
    </text>
    <rect x="147" y="556" width="126" height="34" rx="17" fill="#23324a"/>
    <text x="210" y="579" text-anchor="middle" class="small">896-wide state</text>

    <!-- Learned coordinates -->
    <path d="M 304 495 C 330 495 338 495 358 495" fill="none" stroke="#62d9ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <rect x="372" y="374" width="210" height="242" rx="24" fill="#112943" stroke="#41cfff" stroke-width="2.5"/>
    <rect x="396" y="399" width="162" height="8" rx="4" fill="url(#learned)" filter="url(#softGlow)"/>
    <text x="477" y="443" text-anchor="middle" class="label" fill="#6ae1ff">16 LEARNED</text>
    <text x="477" y="470" text-anchor="middle" class="label white">COORDINATES</text>
    <text x="477" y="513" text-anchor="middle" class="body">
      <tspan x="477" dy="0">Route · operand role</tspan>
      <tspan x="477" dy="27">digit identity</tspan>
    </text>
    <text x="477" y="575" text-anchor="middle" class="small">typed activation interface</text>

    <!-- Exact circuit -->
    <path d="M 582 495 C 607 495 615 495 635 495" fill="none" stroke="#ffbe55" stroke-width="4" marker-end="url(#arrowGold)"/>
    <rect x="650" y="350" width="210" height="290" rx="28" fill="#342616" stroke="#ffb946" stroke-width="2.5"/>
    <circle cx="755" cy="405" r="31" fill="url(#exact)" filter="url(#softGlow)"/>
    <path d="M 737 405 H 773 M 755 387 V 423" stroke="#2b1d0a" stroke-width="7" stroke-linecap="round"/>
    <text x="755" y="469" text-anchor="middle" class="label" fill="#ffd47d">FROZEN ADDER</text>
    <text x="755" y="501" text-anchor="middle" class="label white">EXACT TRANSITION</text>
    <text x="755" y="544" text-anchor="middle" class="body">
      <tspan x="755" dy="0">Decimal ripple-carry</tspan>
      <tspan x="755" dy="27">addition circuit</tspan>
    </text>
    <rect x="684" y="591" width="142" height="32" rx="16" fill="#513819"/>
    <text x="755" y="613" text-anchor="middle" font-size="16" font-weight="750" fill="#ffd47d">0 learned weights</text>

    <!-- Result coordinates -->
    <path d="M 860 495 C 884 495 892 495 912 495" fill="none" stroke="#5ee58d" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <rect x="926" y="374" width="104" height="242" rx="24" fill="#143323" stroke="#57df88" stroke-width="2.5"/>
    <rect x="948" y="400" width="60" height="8" rx="4" fill="url(#result)" filter="url(#softGlow)"/>
    <text x="978" y="451" text-anchor="middle" font-size="30" font-weight="780" fill="#77efa1">12</text>
    <text x="978" y="482" text-anchor="middle" class="small" fill="#c1f7d2">RESULT</text>
    <text x="978" y="507" text-anchor="middle" class="small" fill="#c1f7d2">COORDS</text>
    <text x="978" y="555" text-anchor="middle" class="small">
      <tspan x="978" dy="0">digits</tspan>
      <tspan x="978" dy="23">+ end</tspan>
    </text>

    <!-- Shared MLP rail -->
    <path d="M 116 674 H 1030" stroke="#34455f" stroke-width="2"/>
    <rect x="116" y="659" width="782" height="30" rx="15" fill="#1a273b"/>
    <rect x="898" y="659" width="132" height="30" rx="15" fill="#203f31"/>
    <text x="507" y="680" text-anchor="middle" class="small">4,836 unchanged coordinates</text>
    <text x="964" y="680" text-anchor="middle" font-size="15" font-weight="750" fill="#9bf5b8">28 implanted</text>
    <text x="116" y="725" class="small">Original 4,864-wide layer-16 MLP · original down projection · remaining decoder layers</text>

    <!-- Metrics column -->
    <text x="1142" y="283" class="caps muted" font-size="15">FROZEN FINAL AUDIT · 3 SEEDS</text>

    <text x="1142" y="367" class="metric">173/180</text>
    <text x="1142" y="399" class="metric-label">exact natural-language additions</text>
    <path d="M 1142 425 H 1484" stroke="#2c3b52" stroke-width="2"/>

    <text x="1142" y="500" class="metric" fill="#ffca66">9/180</text>
    <text x="1142" y="532" class="metric-label">exact after result-channel ablation</text>
    <path d="M 1142 558 H 1484" stroke="#2c3b52" stroke-width="2"/>

    <text x="1142" y="633" class="metric" fill="#75eda0">90/90</text>
    <text x="1142" y="665" class="metric-label">word problems exact</text>

    <rect x="1142" y="699" width="342" height="45" rx="22.5" fill="#3b2330" stroke="#a54d68" stroke-width="1.5"/>
    <text x="1313" y="728" text-anchor="middle" font-size="17" font-weight="760" fill="#ff9daf">STRICT VERDICT · 3/5 GATES PASSED</text>

    <!-- Footer -->
    <rect x="72" y="810" width="1456" height="2" fill="#25344b"/>
    <text x="92" y="853" font-size="17" font-weight="700" fill="#d5dfed">Narrow causal feasibility result</text>
    <text x="372" y="853" class="small">Exact circuit trajectories when correctly framed; six operand-framing errors and one downstream decode error remain.</text>
    <text x="1508" y="853" text-anchor="end" class="small">Wilson · 2026</text>
  </g>
</svg>

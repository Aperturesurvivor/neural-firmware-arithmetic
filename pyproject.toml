[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neural-firmware-arithmetic"
version = "0.1.0"
description = "Controlled experiments with frozen algorithmic subnetworks for exact integer addition."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.1",
  "pandas>=2.2",
  "scipy>=1.14",
  "torch>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
nf-train = "neural_firmware.cli:train_main"
nf-evaluate = "neural_firmware.cli:evaluate_main"
nf-study = "neural_firmware.cli:study_main"
nf-analyze = "neural_firmware.cli:analyze_main"

[tool.hatch.build.targets.wheel]
packages = ["src/neural_firmware"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

